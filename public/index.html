<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>IT Help Desk Tracker</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
      <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
      <header class="container-fluid py-4">
            <h1>IT Help Desk Tracker</h1>
      </header>
      <main class="container-fluid">
            <div class="row g-3">
                  <section class="active-tickets col-12 col-lg-3" id="active-tickets">
                        <div class="bg-white border rounded-3 p-3 shadow-sm h-100">
                                <h2>Active Tickets</h2>
                               <button type="button" id="new-ticket-button" class="btn btn-primary">New ticket</button>
                        </div>
                  </section>
                  <section class="ticket-details col-12 col-lg-6" id="ticket-details">
                        <div class="bg-white border rounded-3 p-3 shadow-sm h-100">
                              <h2>Ticket Details</h2>
                              <p>Select a ticket to view its details</p>
                        </div>
                  </section>
                  <section class="resolved-tickets col-12 col-lg-3" id="resolved-tickets">
                        <div class="bg-white border rounded-3 p-3 shadow-sm h-100">
                              <h2>Resolved Tickets</h2>
                        </div>
                  </section>
            </div>
      </main>
      <script src="/js/app.js" defer></script>
</body>
</html>
